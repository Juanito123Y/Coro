name: Build Coro VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Compilar
        run: cmake --build build --config Release --target Coro_VST3 --parallel

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Coro-VST3-${{ matrix.name }}
          path: build/Coro_artefacts/Release/VST3/Coro.vst3
